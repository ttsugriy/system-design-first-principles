project:
  type: book
  output-dir: _site

book:
  title: "System Design from First Principles"
  author: "Taras Tsugrii"
  date: today
  repo-url: https://github.com/ttsugriy/system-design-first-principles
  repo-actions: [edit, issue]

  chapters:
    - index.qmd
    - part: "Part I: Foundations"
      chapters:
        - articles/01-design-space.qmd
        - articles/02-primitives.qmd
        - articles/03-tradeoffs.qmd
        - articles/04-problem-solving.qmd
    - part: "Part II: Primitives Deep-Dives"
      chapters:
        - articles/05-lsm-trees.qmd
        - articles/06-b-trees.qmd
        - articles/07-consensus.qmd
        - articles/08-transactions.qmd
        - articles/09-caching.qmd
    - part: "Part III: Composition"
      chapters:
        - articles/10-combining-primitives.qmd
        - articles/11-case-kv-store.qmd
        - articles/12-case-timeseries.qmd
        - articles/13-case-distributed-queue.qmd
    - part: "Part IV: Temporal Patterns"
      chapters:
        - articles/14-events.qmd
        - articles/15-state-machines.qmd
        - articles/16-ordering.qmd
    - part: "Part V: Operational Patterns"
      chapters:
        - articles/17-resilience.qmd
        - articles/18-observability.qmd
        - articles/19-networking.qmd
    - part: "Part VI: The AI Era"
      chapters:
        - articles/20-ai-design-exploration.qmd
        - articles/21-self-designing-systems.qmd

format:
  html:
    theme:
      light: flatly
      dark: darkly
    code-fold: true
    code-tools: true
    toc: true
    toc-depth: 3
    number-sections: true
    highlight-style: github

execute:
  freeze: auto

bibliography: references.bib
